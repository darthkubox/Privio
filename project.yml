name: Privio
options:
  bundleIdPrefix: com.privio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      PRIVIO_UPDATE_FEED_URL: http://127.0.0.1:8080/appcast.xml
    Release:
      PRIVIO_UPDATE_FEED_URL: https://priviolock.com/updates/appcast.xml

targets:
  PrivioCore:
    type: framework
    platform: macOS
    sources:
      - Sources/PrivioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privio.PrivioCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  Privio:
    type: application
    platform: macOS
    sources:
      - Sources/PrivioApp
      - path: EULA.md
        buildPhase: resources
      - path: EULA.en.md
        buildPhase: resources
      - path: LICENSE.md
        buildPhase: resources
      - path: LICENSE.en.md
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
      - path: PRIVACY.md
        buildPhase: resources
      - path: PRIVACY.en.md
        buildPhase: resources
      - path: SALES.md
        buildPhase: resources
      - path: SALES.en.md
        buildPhase: resources
      - path: Security-Model.md
        buildPhase: resources
      - path: ChromeExtension
        type: folder
        buildPhase: resources
      - path: FirefoxExtension
        type: folder
        buildPhase: resources
    dependencies:
      - target: PrivioCore
        embed: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privio.Privio
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/PrivioApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PrivioApp/Resources/Privio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  PrivioCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PrivioCoreTests
    dependencies:
      - target: PrivioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privio.PrivioCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Privio:
    build:
      targets:
        Privio: all
    run:
      config: Debug
    test:
      targets:
        - PrivioCoreTests
  PrivioCoreTests:
    build:
      targets:
        PrivioCoreTests: all
    test:
      targets:
        - PrivioCoreTests
